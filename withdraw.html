<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>SK Bank Withdrawal</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="withdraw.css">
<script>document.documentElement.dataset.theme=localStorage.getItem("skb-theme")||"dark"</script>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="hd">
  <div class="brand" data-act="home"><span class="crest"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18"/></svg></span><b>SK Bank</b></div>
  <div class="acts">
    <div class="ib" data-act="toggleTheme" role="button" aria-label="Theme"><svg class="i icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></div>
    <div class="btn sm outline" data-act="home" role="button"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Bank</div>
  </div>
</header>
<main class="main">
  <section class="view on">
    <div class="ph"><h3>Withdraw</h3></div>
    <div id="formCard" class="card narrow">
      <div class="fld"><span>Account</span>
        <div id="dd" class="dd">
          <div class="dd-head" data-act="toggle" role="button"><span id="ddLabel">Choose account</span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div id="ddList" class="dd-list hide"><label class="fld"><input id="ddSearch" placeholder="Search" autocomplete="off" spellcheck="false"></label><div id="ddItems" class="dd-items"></div></div>
        </div>
      </div>
      <div id="balanceBox" class="tile balance hide"><small>Main balance</small><b id="balance">$0.00</b></div>
      <div class="fld"><span>Amount</span><div class="amount-row"><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off"><div id="maxButton" class="rg" data-act="max" role="button">Max</div></div></div>
      <div class="fld"><span>Account password</span><input id="password" type="password" autocomplete="off"></div>
      <div class="fld"><span>Transaction PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div id="submit" class="btn primary gated" data-act="submit" role="button"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Request withdrawal</div>
    </div>
    <div id="doneCard" class="card narrow done hide">
      <span class="tag">Pending</span>
      <h2 id="doneAmount">$0.00</h2>
      <small id="doneAccount"></small>
      <div class="btn primary" data-act="home" role="button" style="margin-top:20px">Back to SK Bank</div>
      <div class="btn outline" data-act="again" role="button">New request</div>
    </div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="withdraw.js"></script>
</body>
</html>
