<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>SK Bank Withdrawal</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="withdraw.css">
</head>
<body>
<div id="toast" class="toast"></div>
<div class="page">
  <div id="formCard" class="card">
    <div class="brand"><span class="crest"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18"/></svg></span><div><b>SK Bank</b><small>Withdrawal</small></div></div>
    <div class="fld"><span>Account</span>
      <div id="dd" class="dd">
        <div class="dd-head" data-act="toggle"><span id="ddLabel">Choose account</span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        <div id="ddList" class="dd-list hide"><input id="ddSearch" placeholder="Search" autocomplete="off" spellcheck="false"><div id="ddItems" class="dd-items"></div></div>
      </div>
    </div>
    <div id="balanceBox" class="balance hide"><small>Main balance</small><h2 id="balance">$0.00</h2></div>
    <div class="fld"><span>Amount</span><div class="amount-row"><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off"><div id="maxButton" class="max" data-act="max">Max</div></div></div>
    <div class="fld"><span>Account password</span><input id="password" type="password" autocomplete="off"></div>
    <div class="fld"><span>Transaction PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <div id="submit" class="btn primary gated" data-act="submit" role="button"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Request withdrawal</div>
  </div>
  <div id="doneCard" class="card done hide">
    <span class="tag">Pending</span>
    <h2 id="doneAmount">$0.00</h2>
    <small id="doneAccount"></small>
    <div class="btn outline mt" data-act="again" role="button" style="margin-top:20px">Done</div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="withdraw.js"></script>
</body>
</html>
