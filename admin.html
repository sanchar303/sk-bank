<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>SK Bank Withdrawal Console</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script>document.documentElement.dataset.theme=localStorage.getItem("skb-theme")||"dark"</script>
</head>
<body>
<div id="toast" class="toast"></div>
<header class="hd">
  <div class="brand" data-act="home"><span class="crest"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18"/></svg></span><b>SK Bank</b></div>
  <div class="acts">
    <div class="ib" data-act="toggleTheme" role="button" aria-label="Theme"><svg class="i icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></div>
    <div class="btn sm outline" data-act="home" role="button"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Bank</div>
  </div>
</header>
<main class="main">
  <section id="lockView" class="view on">
    <div class="ph"><h3>Withdrawal console</h3></div>
    <div class="card narrow">
      <div class="fld"><span>Admin password</span><input id="password" type="password" autocomplete="off"></div>
      <div class="fld"><span>Transaction PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div id="unlock" class="btn primary gated" data-act="unlock" role="button"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Unlock</div>
    </div>
  </section>
  <section id="consoleView" class="view hide">
    <div class="ph"><div><h3>Withdrawals</h3><small id="summary"></small></div><div class="btn sm outline" data-act="lock" role="button">Lock</div></div>
    <div class="card"><div class="ch"><b>Pending</b></div><div id="pendingList"></div></div>
    <div class="card"><div class="ch"><b>Recent decisions</b></div><div id="historyList"></div></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
