<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060a14">
  <meta name="description" content="SK Bank Digital Services">
  <title>SK Bank Withdrawal</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('skb-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="stylesheet" href="withdraw.css">
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M5 9v9m4-9v9m6-9v9m4-9v9M3 20h18M12 3l9 5H3l9-5Z"/></svg></span><span class="brand-copy"><strong>SK BANK</strong><small>WITHDRAWAL</small></span></div>
    <div class="topbar-right">
      <div class="icon-control" id="themeToggle" role="button" tabindex="0" aria-label="Toggle light and dark mode" title="Theme"><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5 8.5 8.5 0 1 0 20.5 14.1Z"/></svg></div>
      <div class="icon-control" id="hapticToggle" role="button" tabindex="0" aria-label="Toggle haptic feedback" title="Haptics"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M10 6h4m-3 12h2M3 8v8m18-8v8M1 10v4m22-4v4"/></svg></div>
      <div class="back-bank" id="backToBank" role="button" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5 7 12l7 7M7 12h14"/></svg><span>Back to Bank App</span></div>
    </div>
  </header>

  <main class="admin-shell">
    <section id="adminLogin" class="admin-login-wrap">
      <form id="adminLoginForm" class="admin-login-card" autocomplete="off" novalidate>
        <div class="card-kicker">SK BANK</div><h1>Sign in</h1>
        <div class="field-block"><label for="adminPassword">PASSWORD</label><div class="input-shell"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="adminPassword" class="custom-input" type="password" autocomplete="current-password" placeholder="Password" required></div></div>
        <div class="field-block"><label for="adminPin">TRANSACTION PIN</label><div class="input-shell"><svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></svg><input id="adminPin" class="custom-input" type="password" inputmode="numeric" minlength="4" maxlength="6" placeholder="Transaction PIN" required></div></div>
        <p id="loginError" class="login-error" aria-live="polite"></p>
        <div class="submit-button" id="adminLoginButton" role="button" tabindex="0"><span>Sign in</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </form>
    </section>

    <section id="adminDashboard" class="hidden">
      <div class="admin-head"><div><div class="card-kicker">SK BANK</div><h1>Withdrawal requests</h1></div><div class="admin-head-actions"><div class="admin-action" id="refreshButton" role="button" tabindex="0">Refresh</div><div class="admin-action danger-action" id="logoutButton" role="button" tabindex="0">Sign out</div></div></div>
      <div class="stats-grid">
        <div class="stat-card pending-stat"><span>PENDING</span><b id="pendingCount">0</b></div>
        <div class="stat-card approved-stat"><span>APPROVED</span><b id="approvedCount">0</b></div>
        <div class="stat-card"><span>DECLINED</span><b id="declinedCount">0</b></div>
      </div>
      <div class="admin-panel">
        <div class="panel-toolbar"><div><h2>Activity</h2><p id="requestSummary">Loading…</p></div><div class="toolbar-controls"><input id="searchInput" class="search-input custom-input" type="search" placeholder="Search requests" aria-label="Search requests"><div class="filter-wrap" id="filterWrap"><div id="filterTrigger" class="filter-trigger" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false"><span id="filterLabel">All</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></div><div class="filter-menu hidden" id="filterMenu" role="listbox"><div class="filter-option selected" role="option" tabindex="0" data-filter="all">All</div><div class="filter-option" role="option" tabindex="0" data-filter="pending">Pending</div><div class="filter-option" role="option" tabindex="0" data-filter="approved">Approved</div><div class="filter-option" role="option" tabindex="0" data-filter="declined">Declined</div></div></div></div></div>
        <div id="requestList" class="request-list"><div class="empty-state"><b>Loading</b></div></div>
      </div>
    </section>
  </main>

  <footer class="admin-footer">SK Bank Digital Services. All rights reserved.</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"><span class="toast-mark"></span><span id="toastMessage"></span></div>
  <div id="confirmModal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card"><div class="card-kicker">SK BANK</div><h2 id="confirmTitle">Confirm action</h2><p id="confirmText"></p><div class="confirm-actions"><div id="cancelConfirm" class="admin-action" role="button" tabindex="0">Cancel</div><div id="acceptConfirm" class="admin-action confirm-primary" role="button" tabindex="0">Continue</div></div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
