<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>SK Bank Withdrawal Console</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="toast" class="toast"></div>
<div class="page">
  <div id="lockCard" class="card">
    <div class="brand"><span class="crest"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><div><b>SK Bank</b><small>Withdrawal console</small></div></div>
    <div class="fld"><span>Admin password</span><input id="password" type="password" autocomplete="off"></div>
    <div class="fld"><span>Transaction PIN</span><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <div id="unlock" class="btn primary gated" data-act="unlock" role="button"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Unlock</div>
  </div>
  <div id="consoleCard" class="card wide hide">
    <div class="sp-row">
      <div class="brand" style="margin:0"><span class="crest"><svg class="i" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6zM5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18"/></svg></span><div><b>Withdrawal requests</b><small id="summary"></small></div></div>
      <div class="btn sm outline" data-act="lock" role="button">Lock</div>
    </div>
    <div class="head"><b>Pending</b></div>
    <div id="pendingList"></div>
    <div class="head"><b>Recent decisions</b></div>
    <div id="historyList"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
